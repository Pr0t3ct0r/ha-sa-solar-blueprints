name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # Home Assistant 2026.10 needs 3.14.2 or newer
      - run: pip install -r requirements_test.txt
      - run: pytest -q
